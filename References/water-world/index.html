/* Layout: a chart table — the feature index on the left, the chart window (live three.js view) in the middle,

}

.tbtn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; font-size: 12px; font-weight: 500; color: var(--ink); }

// ═══ three.js (imported on demand) ════════════════════════════════════════════════════════════════
let THREE, OrbitControls, renderer, scene, camera, controls, sun, hemi, sky, skyUniforms, envScene, pmrem, envRT = null, lights = [];
let composer = null, bloomPass = null, bloomLoading = false;
const SKY = {

const SKY_VS = `varying vec3 vWorld;
void main() { vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; gl_Position.z = gl_Position.w; }`;

// ─── Light: sky, sun / moon, hemisphere, environment map, night lamps ──────────────────────────────

// ─── Parts ───────────────────────────────────────────────────────────────────────────────────────
function renderParts() {
  const parts = state.mod.detach || [], pane = ui.panes.parts;

// ─── Code ────────────────────────────────────────────────────────────────────────────────────────
let codeTimer = 0;

function snippetText() {

    `import { createAsset } from './assets/${n}.mjs';`,

    `const asset = createAsset(${Object.keys(p).length ? body : ''});`,
    `scene.add(asset);`,

  lines.push(`renderer.setAnimationLoop((ms) => {`, `  asset.userData.update(ms / 1000);   // water, particles, rigs`, `  renderer.render(scene, camera);`, `});`);

}
function headerDoc(src) { const m = src && src.match(/^\/\*[\s\S]*?\*\//); return m ? m[0].replace(/^\/\*\n?|\*\/$/g, '').replace(/^ \* ?/gm, '').trimEnd() : ''; }

}

        h('button', { class: 'btn', type: 'button', text: src ? `Copy module · ${kfmt(src.length)} chars` : 'Copy module', disabled: !src, onclick: () => { const s = state.src.get(state.name); if (s) copy(s, `${state.name}.mjs`); } })),
      h('p', { class: 'note', text: 'Every module is standalone: it imports only three and BufferGeometryUtils, with no textures or loaders. Map both with an import map (three r170).' })),
    h('div', { class: 'sec' }, h('div', { class: 'sec-h' }, h('h2', { text: 'Module header' })), doc ? h('pre', { class: 'code doc', tabindex: '0' }, h('code', { text: doc })) : h('p', { class: 'empty', text: 'Reading the module…' })),

// ─── Tabs ────────────────────────────────────────────────────────────────────────────────────────
function showTab(id) {

}

// ═══ Scenes ══════════════════════════════════════════════════════════════════════════════════════
async function setMode(mode) {

  state.mode = mode;
  ui.app.dataset.mode = mode;
  $('#mode-lab').setAttribute('aria-selected', String(mode === 'lab'));
  $('#mode-world').setAttribute('aria-selected', String(mode === 'world'));
  ui.tabs.hidden = mode === 'world';
  ui.q.value = '';

  state.follow = null;
  if (mode === 'world') {
    for (const p of Object.values(ui.panes)) p.hidden = true;
    ui.panes.world.hidden = false;
    if (state.asset) state.asset.removeFromParent();
    renderIndex(); renderWorldPanel();
    if (!state.world) await buildWorld(state.sceneId);
    else { scene.add(state.world.root); state.env = state.world.env; applyLighting(true); setLamps(state.world.lamps); setClip(0, true); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5)); resize(); worldCartouche(); history.replaceState(null, '', `#scene/${state.sceneId}`); }

}
$('#mode-lab').onclick = () => setMode('lab');
$('#mode-world').onclick = () => setMode('world');

const sceneMeta = (id) => (state.scenes || []).find((s) => s.id === id) || { id, title: id, blurb: '' };
async function buildWorld(id = state.sceneId) {

  state.selected = null; state.follow = null;
  renderWorldPanel(); renderIndex();
  veil('Importing the scene', 'scene.mjs', 0);

    const mod = await import('./scene.mjs');
    state.scenes = mod.SCENES;
    const meta = sceneMeta(id);
    setCartouche('Scene', meta.title, meta.blurb, '');
    renderWorldPanel();
    const world = await mod.createScene(id, {
      base: './assets/', scenes: './scenes/', quality: state.lite ? 'medium' : 'high',
      onProgress: (d, n, label) => veil(`Building ${label}`, `${meta.title} · ${d} of ${n}`, d / n),
    });
    state.worldMs = performance.now() - t0;
    prepare(world.root);
    world.setNight(state.night);
    world.lamps = world.items.flatMap((i) => lampsFor(i.object, i.night));
    world.tris = world.triangles;
    state.world = world;
    if (state.mode === 'world') {
      scene.add(world.root);
      state.env = world.env; applyLighting(true);
      setLamps(world.lamps);
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5)); resize();
      setClip(0, true);
      const o = world.spots[0];
      flyTo(o.target, o.radius, { az: o.az ?? Math.PI * 0.18, el: o.el ?? 0.62, instant: true });
    }
    if (state.mode === 'world') history.replaceState(null, '', `#scene/${id}`);
    worldCartouche();
    unveil();
  } catch (e) {
    veilError('The scene could not be built', String(e && e.message ? e.message : e), () => buildWorld(id));
  } finally {

}
function worldCartouche() {
  const w = state.world;

    `${w.items.length} assets · ${kfmt(w.tris)} triangles · built in ${(state.worldMs / 1000).toFixed(1)} s`);
}
function spotOf(item) { return state.world.spots.find((s) => s.id === item.id); }
function goSpot(s) { state.follow = null; flyTo(s.target, s.radius, { az: s.az ?? null, el: s.el ?? null }); }
function renderWorldIndex(q) {

    b.innerHTML = FLARE; b.append(h('span', { class: 'nm', text: title }), h('span', { class: 'tc', text: sub }));

  };
  if (places.length) ui.toc.append(h('section', { class: 'grp' }, h('h3', null, 'Places', h('span', { class: 'mono', text: places.length })), h('ul', null, places.map((s) => mk(s.id, s.title, '', () => goSpot(s), true)))));

  for (const [g, list] of groups) ui.toc.append(h('section', { class: 'grp' }, h('h3', null, g, h('span', { class: 'mono', text: list.length })), h('ul', null, list.map((i) => mk(i.id, i.title, kfmt(i.object.userData.triangles || 0), () => selectItem(i, true))))));

}

    if (s) goSpot(s);
    else { const b = bounds(item.object), c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3()); flyTo([c.x, c.y, c.z], Math.max(10, Math.max(sz.x, sz.z) * 1.6), {}); }
  }

  if (e) setCartouche(`${state.world.title} · ${e.category}`, item.title, e.blurb, `${(item.object.userData.triangles || 0).toLocaleString('en-US')} triangles · ${item.name}.mjs`);
}
function renderWorldPanel() {

    h('div', { class: 'scene-pick', role: 'group', 'aria-label': 'Choose a scene' }, list.map((s) => h('button', {

    }, h('b', { text: s.title }), h('span', { text: s.blurb }))))));

    pane.append(h('div', { class: 'sec' },
      h('div', { class: 'stat-grid' },
        h('div', { class: 'stat' }, h('b', { text: w.items.length }), h('span', { text: 'assets placed' })),
        h('div', { class: 'stat' }, h('b', { text: kfmt(w.tris) }), h('span', { text: 'triangles' })),
        h('div', { class: 'stat' }, h('b', { id: 'w-calls', text: calls || '…' }), h('span', { text: 'draw calls in view' })),
        h('div', { class: 'stat' }, h('b', { id: 'w-fps', text: '…' }), h('span', { text: 'frames per second' })))));

        sel.follow ? h('button', { class: 'btn', type: 'button', text: state.follow === sel ? 'Stop following' : 'Follow', onclick: () => { state.follow = state.follow === sel ? null : sel; if (state.follow) { const s = spotOf(sel); const p = sel.object.getWorldPosition(new THREE.Vector3()); flyTo([p.x, p.y + 1.2, p.z], s ? Math.min(s.radius, 40) : 24, { el: 0.35 }); } renderWorldPanel(); } }) : null,
        h('button', { class: 'btn primary', type: 'button', text: 'Open in Asset Lab', onclick: () => openInLab(sel) }));
      pane.append(h('div', { class: 'sec' }, h('div', { class: 'sec-h' }, h('h2', { text: 'Selected' })),
        h('div', { class: 'sel-card' }, h('span', { class: 'eyebrow', text: [sel.group, e ? e.category : ''].filter(Boolean).join(' · ') }), h('h3', { text: sel.title }), h('p', { text: e ? e.blurb : '' }),
          Object.keys(sel.params || {}).length ? h('p', { class: 'note mono', text: Object.entries(sel.params).map(([k, v]) => `${k}: ${JSON.stringify(v)}`).join(' · ') }) : null, actions)));
    } else pane.append(h('p', { class: 'note', text: 'Click any asset in the view, or pick one from the index, to select it.' }));
    pane.append(h('div', { class: 'sec' }, h('div', { class: 'sec-h' }, h('h2', { text: 'Places' })),
      h('div', { class: 'chips' }, w.spots.filter((s) => !w.items.some((i) => i.id === s.id)).map((s) => h('button', { class: 'chip', type: 'button', text: s.title, onclick: () => goSpot(s) })))));
  }
  const box = h('input', { type: 'checkbox', id: 'w-lite', role: 'switch' });
  box.checked = state.lite;
  box.addEventListener('change', () => { state.lite = box.checked; store.set('lite', state.lite); rebuildBtn.disabled = state.worldBuilding; });
  const rebuildBtn = h('button', { class: 'btn', type: 'button', text: 'Rebuild scene', disabled: state.worldBuilding, onclick: () => buildWorld(state.sceneId) });
  pane.append(h('div', { class: 'sec' }, h('div', { class: 'sec-h' }, h('h2', { text: 'Build' })),
    h('div', { class: 'ctl' }, h('label', { for: 'w-lite', text: 'Lighter terrain & sea' }), h('span', { class: 'switch' }, box, h('span')), h('p', { class: 'hint', text: 'Coarser landscape and ocean grids for phones and older GPUs. Applies on the next build.' })),

}
function openInLab(item) {
  const params = { ...item.params };
  // in the lab every asset gets back the pieces its surroundings supplied in the scene
  for (const k of ['waterPatch', 'seaWater', 'seaPatch', 'base', 'showGround', 'site']) delete params[k];
  setMode('lab').then(() => selectAsset(item.name, { params }));
}
setInterval(() => {
  if (state.mode !== 'world' || !state.world || !renderer) return;
  const c = $('#w-calls'), f = $('#w-fps');
  if (c) c.textContent = renderer.info.render.calls;
  if (f) f.textContent = Math.round(fpsAvg);
}, 700);

// ═══ Transport ═══════════════════════════════════════════════════════════════════════════════════
const PLAY = '<path d="M5 3.2v9.6l8-4.8z" fill="currentColor"/>', PAUSE = '<path d="M5 3.5v9M11 3.5v9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
function syncPlay() { $('#play-ico').innerHTML = state.playing ? PAUSE : PLAY; $('#play').setAttribute('aria-label', state.playing ? 'Pause animation' : 'Play animation'); }
$('#play').onclick = () => { state.playing = !state.playing; syncPlay(); };
const SPEEDS = [0.25, 0.5, 1, 2, 4];
$('#speed').onclick = () => { const i = (SPEEDS.indexOf(state.speed) + 1) % SPEEDS.length; state.speed = SPEEDS[i]; $('#speed').textContent = `${state.speed}×`; };
ui.night.addEventListener('input', () => {
  state.night = +ui.night.value;
  if (!THREE) return;
  applyLighting();
  if (state.mode === 'lab' && state.asset) state.asset.userData.setNight(state.night);
  if (state.world) state.world.setNight(state.night);
  renderCodeSoon();
});
$('#frame').onclick = () => { if (state.mode === 'lab') frameAsset(); else { const o = state.world && state.world.spots.find((s) => s.id === 'overview'); if (o) goSpot(o); } };
$('#orbit').onclick = (e) => { state.orbit = !state.orbit; controls.autoRotate = state.orbit; controls.autoRotateSpeed = 0.8; e.currentTarget.setAttribute('aria-pressed', String(state.orbit)); };
$('#wire').onclick = (e) => {
  state.wire = !state.wire; e.currentTarget.setAttribute('aria-pressed', String(state.wire));
  for (const r of [state.asset, state.world && state.world.root]) if (r) r.traverse((o) => { if (o.isMesh && o.material && o !== sky) o.material.wireframe = state.wire; });
};
$('#bloom').onclick = async (e) => {
  const btn = e.currentTarget;
  if (state.bloom) { state.bloom = false; if (composer && composer.dispose) composer.dispose(); composer = null; btn.setAttribute('aria-pressed', 'false'); return; }
  if (bloomLoading) return;
  bloomLoading = true; btn.textContent = 'Loading…';
  try {
    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'), import('three/addons/postprocessing/OutputPass.js'),
    ]);
    const r = ui.stage.getBoundingClientRect();

    composer.addPass(new RenderPass(scene, camera));
    bloomPass = new UnrealBloomPass(new THREE.Vector2(r.width, r.height), 0.55, 0.45, 0.82);
    composer.addPass(bloomPass);

  } finally { bloomLoading = false; btn.textContent = 'Bloom'; }
};
addEventListener('keydown', (e) => {
  if (e.target.closest('input, select, textarea, [contenteditable]')) return;
  if (e.code === 'Space') { e.preventDefault(); state.playing = !state.playing; syncPlay(); }
  else if (e.key === 'f' || e.key === 'F') $('#frame').click();
});

// ═══ Boot ════════════════════════════════════════════════════════════════════════════════════════
async function boot() {
  syncPlay();
  if (location.protocol === 'file:') {
    veilError('Open this page through a web server', 'Browsers block module imports from file:// pages. In this folder run “npx serve” or “python3 -m http.server”, then open the address it prints.');
    return;
  }
  try {
    const r = await fetch('./manifest.json');
    if (!r.ok) throw new Error(`manifest.json: HTTP ${r.status}`);
    state.manifest = await r.json();
  } catch (e) {
    veilError('The asset index could not be read', String(e && e.message ? e.message : e), () => location.reload());
    return;
  }
  for (const a of state.manifest) state.byName.set(a.name, a);
  $('#brand-sub').textContent = `Asset Lab · ${state.manifest.length} parametric three.js assets about water`;
  ui.q.placeholder = `Search ${state.manifest.length} assets`;
  renderIndex();
  showTab(store.get('tab', 'params'));
  const hash = decodeURIComponent(location.hash.slice(1));
  const first = state.byName.has(hash) ? hash : state.byName.has(store.get('asset', '')) ? store.get('asset', '') : 'waterfall';
  const e = state.byName.get(first) || state.manifest[0];
  setCartouche(e.category, e.title, e.blurb, e.specs ? specsLine(e.specs.triangles, e.specs.size, null) : '');
  try { await init3D(); } catch { return; }
  if (hash === 'world' || hash.startsWith('scene/')) { const id = hash.slice(6); if (['source-to-sea', 'harbour-town', 'tropical-island', 'polar-fjord'].includes(id)) state.sceneId = id; state.name = e.name; await setMode('world'); }
  else await selectAsset(e.name);
}
boot();
