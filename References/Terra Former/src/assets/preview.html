<body>
  <header><div><strong>terra.</strong><small>A world that keeps going.</small></div><div><button id="fit">Fit view</button><button id="light">Night</button><button id="save">Save world</button></div></header>
  <main>
    <aside>
      <h1>Your world, your way.</h1><p>Walk from one landscape into the next. Every change stays where you made it.</p>
      <div class="tools" id="tools"></div><div id="brush"></div>
      <div class="field"><label for="part">Edit scene part</label><select id="part"><option value="world">Terrain &amp; environment</option><option value="tree">Trees &amp; foliage</option><option value="rock">Rocks &amp; stone</option></select></div>

      <button id="undo" class="reset">Undo last sculpt stroke</button>
      <p class="status" id="status" role="status">Preparing your landscape...</p>
    </aside>
    <section id="viewport" class="viewport" aria-label="Interactive terrain">
      <div class="hint">Drag to orbit. WASD or the travel dial to explore.</div>
      <div class="hud"><strong id="biome">Finding your bearings</strong><small id="coords"></small><small id="blend"></small></div>
      <div id="dial" class="joystick" role="application" aria-label="Hold and drag to travel"><i>N</i><span></span></div>
    </section>
  </main>

    }
    function tools(){const root=document.querySelector('#tools');root.replaceChildren();['orbit','raise','lower','flatten','calm','roughen'].forEach((id,i)=>{const b=document.createElement('button');b.textContent=['Look','Raise','Carve','Flatten','Calm','Roughen'][i];b.setAttribute('aria-pressed',String(tool===id));b.onclick=()=>{endStroke();tool=id;orbit.enableRotate=orbit.enablePan=id==='orbit';renderer.domElement.style.cursor=id==='orbit'?'grab':'crosshair';tools();};root.append(b);});}
