<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6147">
  <title>Terra / Landscape Preview</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#2d3930;background:#eff2eb;font:13px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:62px;position:fixed;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff;border-bottom:1px solid #e3e7df;z-index:2}.brand{font-size:27px;font-weight:650;letter-spacing:-1.5px;color:#2e6345}.brand span{font-size:12px;letter-spacing:0;color:#839080;font-weight:400;margin-left:20px}header button{border:1px solid #dfe5db;background:#fff;border-radius:6px;padding:8px 12px;color:#3c5945;margin-left:7px}aside{position:fixed;top:62px;bottom:0;left:0;width:276px;overflow:auto;background:#fff;border-right:1px solid #e0e5dc;padding:24px 20px;z-index:2}h1{font-size:18px;letter-spacing:-.4px;margin:0 0 6px}aside>p{font-size:12px;color:#849080;line-height:1.6;margin:0 0 23px}.field{margin:18px 0}.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px;color:#5b6859}.label output{font-variant-numeric:tabular-nums;color:#2f6346}input[type=range]{width:100%;accent-color:#326c4b;height:4px;cursor:pointer}input[type=color]{width:100%;height:28px;padding:2px;border:1px solid #dee5d9;border-radius:4px;background:#fff}input[type=checkbox]{accent-color:#326c4b;width:16px;height:16px}select{width:100%;padding:9px 10px;color:#40503d;background:#f9faf7;border:1px solid #e0e6dc;border-radius:5px}details{border-top:1px solid #e4e8df;padding:17px 0 0;margin-top:20px}summary{font-size:12px;font-weight:600;cursor:pointer}.viewport{position:fixed;top:62px;right:0;bottom:0;left:276px}.viewport canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;bottom:23px;left:50%;transform:translateX(-50%);font-size:11px;color:#7e8e7c;white-space:nowrap}.notice{position:absolute;inset:40%;width:300px;line-height:1.7;color:#71816b}#part{margin-bottom:5px}.tiny{font-size:10px;color:#899181;line-height:1.65;margin-top:25px}.night header,.night aside{background:#24332c;color:#dce6d9;border-color:#3a4a3f}.night .label,.night aside>p{color:#abbba6}.night .brand{color:#dae8d1}.night details{border-color:#3a4a3f}.night select,.night header button{color:#d7e3d0;background:#2c3d32;border-color:#455b46}.night .label output{color:#c5d9b5}@media(max-width:650px){header{height:56px;padding:0 15px}.brand span{display:none}aside{top:auto;bottom:0;height:37%;width:100%;border-right:0;border-top:1px solid #dae1d5;padding:17px 20px}.viewport{top:56px;left:0;bottom:37%}.hint{font-size:10px;bottom:10px}h1{font-size:16px}aside>p{margin-bottom:12px}.field{margin:15px 0}header button{font-size:11px;padding:7px 9px}}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <header><div class="brand">terra<span>A little world, made by you.</span></div><div><button id="reset">Reset view</button><button id="theme">Night view</button></div></header>
  <aside><h1>Your landscape</h1><p>Explore every angle. Make it your own.</p><label class="label" for="part">Scene parts</label><select id="part"><option value="terrain">Landscape &amp; environment</option><option value="pine">Pine forest</option><option value="rock">Scattered rocks</option></select><div id="controls"></div><p class="tiny">1 unit = 1 meter. Changes rebuild the geometry.<br>Drag to orbit. Right-drag to pan. Scroll to zoom.</p></aside>
  <main class="viewport" id="viewport"><div class="hint">Drag to explore your world</div></main>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createScene, sceneParams } from './scene.mjs';
    import { params as terrainParams, night as terrainNight } from './terrain.mjs';
    import { params as pineParams, createAsset as createPine } from './alpine-pine.mjs';
    import { params as rockParams, createAsset as createRock } from './field-rock.mjs';
    const INITIAL_OPTIONS = {};
    const values = { ...Object.fromEntries(Object.entries({...terrainParams,...sceneParams}).filter(([,schema])=>schema.type!=='color').map(([key,schema])=>[key,schema.default])), ...INITIAL_OPTIONS };
    const overrides = { pine:{}, rock:{} };
    const viewport = document.querySelector('#viewport');
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#eef1eb'); scene.fog = new THREE.Fog('#eef1eb', 300, 700);
    let renderer;
    try { renderer = new THREE.WebGLRenderer({antialias:true}); } catch { viewport.innerHTML='<p class="notice">WebGL 2 is unavailable. Enable hardware acceleration and reload this preview.</p>'; throw new Error('WebGL 2 is required'); }
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25; viewport.appendChild(renderer.domElement);
    const camera = new THREE.OrthographicCamera(-110,110,110,-110,.1,1500);
    const orbit = new OrbitControls(camera,renderer.domElement); orbit.enableDamping=true; orbit.maxPolarAngle=Math.PI/2.08; orbit.minZoom=.4; orbit.maxZoom=4;
    const hemi = new THREE.HemisphereLight(0xffffff,0x717b66,1.2), key = new THREE.DirectionalLight(0xfff9e9,1.5), ambient = new THREE.AmbientLight(0xffffff,.5);
    key.position.set(-90,150,100); key.castShadow=true; key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-180,right:180,top:180,bottom:-180,near:1,far:600}); key.shadow.normalBias=.08; scene.add(hemi,key,ambient);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:'#e8ece5',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-7.34;floor.receiveShadow=true;scene.add(floor);
    const grid=new THREE.GridHelper(640,64,'#b9c6b1','#ccd6c5');grid.position.y=-7.3;grid.material.transparent=true;grid.material.opacity=.25;scene.add(grid);
    let model, isNight=false;
    function dispose(root){const mats=new Set();root.traverse(o=>{if(o.isMesh){o.geometry.dispose();(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>mats.add(m));}});mats.forEach(m=>m.dispose());}
    function applyLight(){scene.background.set(isNight?'#263632':'#eef1eb');scene.fog.color.copy(scene.background);floor.material.color.set(isNight?'#283a31':'#e8ece5');hemi.intensity=isNight?.65:1.2;key.intensity=isNight?.35:1.5;ambient.intensity=isNight?.18:.5;model?.traverse(o=>{if(o.isMesh&&o.name==='water'){o.material.emissive.set(isNight?terrainNight.water.color:'#000000');o.material.emissiveIntensity=isNight?terrainNight.water.intensity:0;}});}
    function rebuild(){if(model){scene.remove(model);dispose(model);}model=createScene(values);for(const [kind,groupName,factory]of[['pine','vegetation',createPine],['rock','rocks',createRock]]){if(!Object.keys(overrides[kind]).length)continue;const parent=model.getObjectByName(groupName);for(const old of [...parent.children]){const fresh=factory({...old.userData.params,...overrides[kind]});fresh.name=old.name;fresh.position.copy(old.position);fresh.rotation.copy(old.rotation);parent.remove(old);dispose(old);parent.add(fresh);}}scene.add(model);applyLight();}
    function resize(){const w=viewport.clientWidth,h=viewport.clientHeight,aspect=w/h,size=Number(values.size)||128,height=Math.max(size*1.3,size*1.79/aspect);camera.left=-height*aspect/2;camera.right=height*aspect/2;camera.top=height/2;camera.bottom=-height/2;camera.updateProjectionMatrix();renderer.setSize(w,h);}
    function reset(){const size=Number(values.size)||128;camera.position.set(size*.96,size*1.05,size*1.16);orbit.target.set(0,5,0);camera.zoom=1;orbit.update();resize();}
    function controls(){const kind=document.querySelector('#part').value,schemas=kind==='terrain'?{...terrainParams,...sceneParams}:kind==='pine'?pineParams:rockParams,target=kind==='terrain'?values:overrides[kind];const root=document.querySelector('#controls');root.replaceChildren();const shape=document.createElement('details'),color=document.createElement('details');shape.open=true;shape.innerHTML='<summary>Shape &amp; composition</summary>';color.innerHTML='<summary>Colors &amp; materials</summary>';root.append(shape,color);for(const[key,schema]of Object.entries(schemas)){const field=document.createElement('div');field.className='field';field.title=schema.describe;const line=document.createElement('div');line.className='label';const label=document.createElement('label');label.textContent=schema.label;label.htmlFor=`field-${key}`;line.append(label);let input;if(schema.type==='choice'){input=document.createElement('select');for(const option of schema.options){const item=document.createElement('option');item.value=String(option);item.textContent=String(option);input.append(item);}}else{input=document.createElement('input');input.type=schema.type==='range'?'range':schema.type==='toggle'?'checkbox':'color';}input.id=`field-${key}`;const current=target[key]??schema.default;if(schema.type==='toggle')input.checked=Boolean(current);else input.value=String(current);if(schema.type==='range'){input.min=schema.min;input.max=schema.max;input.step=schema.step||1;const output=document.createElement('output');output.value=current;line.append(output);input.addEventListener('input',()=>{output.value=input.value;});}input.addEventListener(schema.type==='range'?'input':'change',()=>{target[key]=schema.type==='toggle'?input.checked:schema.type==='range'||typeof schema.default==='number'?Number(input.value):input.value;rebuild();if(key==='size')reset();});if(schema.type==='toggle'){line.append(input);field.append(line);}else field.append(line,input);(schema.affects==='colors'?color:shape).append(field);}}
    document.querySelector('#part').addEventListener('change',controls);document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#theme').addEventListener('click',()=>{isNight=!isNight;document.body.classList.toggle('night',isNight);document.querySelector('#theme').textContent=isNight?'Day view':'Night view';applyLight();});
    new ResizeObserver(resize).observe(viewport);rebuild();controls();reset();
    renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera);});
    window.addEventListener('pagehide',()=>{renderer.setAnimationLoop(null);orbit.dispose();if(model)dispose(model);renderer.dispose();});
  </script>
</body>
</html>
